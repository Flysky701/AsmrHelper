[package]
name = "asmr-helper"
default-run = "asmr-helper"
version = "1.1.0"
edition = "2021"
license = "CC-BY-NC-4.0"

[[bin]]
name = "asmr-helper-local"
path = "src/bin/local.rs"

[[bin]]
name = "asmr-helper-local-next"
path = "src/bin/local_next.rs"

[lib]
name = "asmr_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }
