models:
  - id: faster-whisper-tiny
    kind: local
    category: asr
    provider: faster_whisper
    display_name: Faster-Whisper Tiny
    description: Fastest Whisper model with the lowest accuracy.
    install_root: models
    install_path: whisper/tiny
    required_files:
      - model.bin
      - config.json
      - tokenizer.json
    required_dirs: []
    supports_install: true
    supports_remove: true
    install_strategy: whisper

